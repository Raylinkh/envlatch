name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Validate scripts and metadata
        run: |
          zsh -n scripts/build-app.sh scripts/install.sh scripts/install-preview.sh scripts/pair-agents.sh scripts/package-release.sh scripts/package-unsigned-preview.sh
          plutil -lint Resources/Info.plist
          git diff --check

      - name: Test
        run: swift test

      - name: Build and verify app bundle
        run: |
          ./scripts/build-app.sh
          codesign --verify --deep --strict dist/EnvLatch.app
          test -f dist/EnvLatch.app/Contents/Resources/AppIcon.icns
          test "$(dist/EnvLatch.app/Contents/MacOS/EnvLatch --version)" = "EnvLatch 0.1.0"

      - name: Package unsigned preview
        run: |
          ./scripts/package-unsigned-preview.sh
          dmg="$(find dist -maxdepth 1 -name 'EnvLatch-0.1.0-macos-*-unsigned.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          artifact="$(basename "$dmg")"
          cd dist
          shasum -a 256 -c "$artifact.sha256"
